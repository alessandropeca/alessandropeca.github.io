name: Update Bibliography

on:
  schedule:
    # Run every Monday at 9 AM UTC (weekly)
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-bibliography:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        # ubuntu-latest moved to Ubuntu 26.04, whose runner image no longer
        # ships Python 3.9.
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        pip install requests numpy
        
    - name: Update bibliography
      env:
        ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
      run: |
        python update_bibliography.py
        
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/ads_data_first.json data/ads_data_all.json index.html
        git diff --staged --quiet || git commit -m "Update bibliography data - $(date '+%Y-%m-%d')"
        git push